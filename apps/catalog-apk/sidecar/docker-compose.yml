# Catalog APK FlareSolverr sidecar — real Chromium challenge solver on the host.
# Bind loopback by default. For phone-on-Wi‑Fi, set FLARESOLVERR_BIND=0.0.0.0 and
# use a trusted LAN only (or prefer adb reverse — see adb-reverse.ps1).
services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: catalog-apk-flaresolverr
    ports:
      - "${FLARESOLVERR_BIND:-127.0.0.1}:8191:8191"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-Africa/Harare}
      HOST: "0.0.0.0"
      PORT: "8191"
    restart: unless-stopped
