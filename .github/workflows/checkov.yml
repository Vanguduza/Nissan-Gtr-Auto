# Checkov IaC — Nissan GTR (DIAL D-48 habits)
# Hard-fail on HIGH/CRITICAL. LOW/MEDIUM soft-fail.

name: checkov

on:
  pull_request:
    paths:
      - "**/Dockerfile*"
      - "**/docker-compose*.yml"
      - "**/compose*.yml"
      - "infra/**"
      - ".github/workflows/**"
      - "**/*.tf"
      - "**/Chart.yaml"
      - "**/*.yaml"
      - "**/*.yml"
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkov:
    name: Checkov (hard-fail HIGH+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@c10e2438743528f9e4549758fad8b7a62052541d # v12
        with:
          directory: .
          # docker_compose is not a Checkov framework (it aborted the run); compose files have no IaC checks.
          framework: dockerfile,github_actions,kubernetes,terraform
          soft_fail: false
          soft_fail_on: LOW,MEDIUM
          hard_fail_on: HIGH,CRITICAL
          skip_path: node_modules,docs,.tmp,reference,data-pipeline
          download_external_modules: false
          quiet: false
          output_format: cli
