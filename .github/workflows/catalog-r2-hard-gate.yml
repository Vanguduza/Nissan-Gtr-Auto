name: Catalog R2 hard gate

# Triggered from ChatGPT hard-gate execution. This workflow never prints R2 credential values.
on:
  push:
    branches:
      - chatgpt/customer-ui-catalog-hardening-20260902
    paths:
      - .github/workflows/catalog-r2-hard-gate.yml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  BROKER_URL: https://gylrgwqyuiwkyykardwc.supabase.co/functions/v1/catalog-r2-publish-broker
  ENV_PROBE_URL: https://gylrgwqyuiwkyykardwc.supabase.co/functions/v1/catalog-r2-env-probe?gate=mDrRxr4EgqSWwLmyjvIsaCzOWSturqvQSDrQMwLTrEI
  OIDC_AUDIENCE: nissan-gtr-catalog-publisher

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/customer-ui-catalog-hardening-20260902

      - name: Probe deployed R2 environment presence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/audits
          curl -fsS "$ENV_PROBE_URL" -o docs/audits/catalog-r2-edge-env-presence.json
          cat docs/audits/catalog-r2-edge-env-presence.json

      - name: Mint GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")
          token=$(printf '%s' "$response" | jq -r '.value')
          test -n "$token" && test "$token" != "null"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Inventory live R2 release
        id: inventory
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o docs/audits/catalog-r2-hard-gate-inventory.json -w '%{http_code}' \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"action":"inventory"}' \
            "$BROKER_URL")
          echo "$status" > docs/audits/catalog-r2-hard-gate-http-status.txt
          echo "http_status=$status" >> "$GITHUB_OUTPUT"
          cat docs/audits/catalog-r2-hard-gate-inventory.json

      - name: Persist hard-gate evidence on branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nissan-gtr-catalog-gate"
          git config user.email "catalog-gate@users.noreply.github.com"
          git add docs/audits/catalog-r2-edge-env-presence.json docs/audits/catalog-r2-hard-gate-inventory.json docs/audits/catalog-r2-hard-gate-http-status.txt
          if git diff --cached --quiet; then
            echo "Audit unchanged"
          else
            git commit -m "audit: persist live R2 hard-gate evidence [skip ci]"
            git push origin HEAD:chatgpt/customer-ui-catalog-hardening-20260902
          fi

      - name: Enforce broker success
        if: always()
        shell: bash
        run: |
          jq -e '.ok == true' docs/audits/catalog-r2-edge-env-presence.json >/dev/null
          test "${{ steps.inventory.outputs.http_status }}" = "200"
          jq -e '.ok == true' docs/audits/catalog-r2-hard-gate-inventory.json >/dev/null
