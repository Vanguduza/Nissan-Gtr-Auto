name: Catalog R2 hard gate

# Uses GitHub OIDC to call the Supabase broker. R2 credentials remain only in Supabase Edge secrets.
# Hard-gate retrigger after R2 secrets sync: 2026-09-02T19:12+02:00
on:
  push:
    branches:
      - chatgpt/customer-ui-catalog-hardening-20260902
    paths:
      - .github/workflows/catalog-r2-hard-gate.yml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  BROKER_URL: https://gylrgwqyuiwkyykardwc.supabase.co/functions/v1/catalog-r2-publish-broker
  OIDC_AUDIENCE: nissan-gtr-catalog-publisher

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/customer-ui-catalog-hardening-20260902

      - name: Mint GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")
          token=$(printf '%s' "$response" | jq -r '.value')
          test -n "$token" && test "$token" != "null"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Inventory live R2 release
        id: inventory
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p docs/audits
          status=$(curl -sS -o docs/audits/catalog-r2-hard-gate-inventory.json -w '%{http_code}' \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"action":"inventory"}' \
            "$BROKER_URL")
          echo "$status" > docs/audits/catalog-r2-hard-gate-http-status.txt
          echo "http_status=$status" >> "$GITHUB_OUTPUT"
          cat docs/audits/catalog-r2-hard-gate-inventory.json

      - name: Probe encrypted bundle header without downloading catalog
        if: steps.inventory.outputs.http_status == '200'
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          bundle_key=$(jq -r '.release.bundle_object_key' docs/audits/catalog-r2-hard-gate-inventory.json)
          payload=$(jq -nc --arg key "$bundle_key" '{action:"presign-get",key:$key}')
          curl -fsS \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$BROKER_URL" > /tmp/presign.json
          signed_url=$(jq -r '.signed_url' /tmp/presign.json)
          test -n "$signed_url" && test "$signed_url" != "null"
          curl -fsS -r 0-127 "$signed_url" -o /tmp/catalog-header.bin
          xxd -p -c 128 /tmp/catalog-header.bin > docs/audits/catalog-r2-bundle-header.hex
          wc -c /tmp/catalog-header.bin | awk '{print $1}' > docs/audits/catalog-r2-bundle-header-bytes.txt

      - name: Persist inventory evidence on hardening branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nissan-gtr-catalog-gate"
          git config user.email "catalog-gate@users.noreply.github.com"
          git add docs/audits/catalog-r2-hard-gate-inventory.json docs/audits/catalog-r2-hard-gate-http-status.txt docs/audits/catalog-r2-bundle-header.hex docs/audits/catalog-r2-bundle-header-bytes.txt
          if git diff --cached --quiet; then
            echo "Inventory unchanged"
          else
            git commit -m "audit: persist live R2 hard-gate inventory and bundle probe [skip ci]"
            git push origin HEAD:chatgpt/customer-ui-catalog-hardening-20260902
          fi

      - name: Enforce broker success
        if: always()
        shell: bash
        run: |
          test "${{ steps.inventory.outputs.http_status }}" = "200"
          jq -e '.ok == true' docs/audits/catalog-r2-hard-gate-inventory.json >/dev/null
          test -s docs/audits/catalog-r2-bundle-header.hex
