name: Catalog R2 hard gate

on:
  push:
    branches:
      - chatgpt/customer-ui-catalog-hardening-20260902
    paths:
      - .github/workflows/catalog-r2-hard-gate.yml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  BROKER_URL: https://gylrgwqyuiwkyykardwc.supabase.co/functions/v1/catalog-r2-publish-broker
  DIAGRAM_SYNC_URL: https://gylrgwqyuiwkyykardwc.supabase.co/functions/v1/catalog-r2-diagram-sync
  OIDC_AUDIENCE: nissan-gtr-catalog-publisher

jobs:
  diagram-map:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/customer-ui-catalog-hardening-20260902

      - name: Mint GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")
          token=$(printf '%s' "$response" | jq -r '.value')
          test -n "$token" && test "$token" != "null"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Register all R2 diagram objects against catalog diagram IDs
        id: sync
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p docs/audits
          next=""
          pages=0
          listed=0
          matched=0
          unmatched=0
          : > docs/audits/catalog-r2-diagram-sync-pages.ndjson
          while true; do
            if [ -n "$next" ]; then
              payload=$(jq -nc --arg next "$next" '{next:$next}')
            else
              payload='{}'
            fi
            response=$(curl -fsS \
              -H "Authorization: Bearer ${OIDC_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "$DIAGRAM_SYNC_URL")
            echo "$response" >> docs/audits/catalog-r2-diagram-sync-pages.ndjson
            jq -e '.ok == true' <<<"$response" >/dev/null
            pages=$((pages+1))
            listed=$((listed + $(jq -r '.listed' <<<"$response")))
            matched=$((matched + $(jq -r '.matched' <<<"$response")))
            unmatched=$((unmatched + $(jq -r '.unmatched' <<<"$response")))
            done=$(jq -r '.done' <<<"$response")
            if [ "$done" = "true" ]; then break; fi
            next=$(jq -r '.next // empty' <<<"$response")
            test -n "$next"
          done
          jq -nc \
            --argjson pages "$pages" \
            --argjson listed "$listed" \
            --argjson matched "$matched" \
            --argjson unmatched "$unmatched" \
            '{ok:true,pages:$pages,listed:$listed,matched:$matched,unmatched:$unmatched}' \
            > docs/audits/catalog-r2-diagram-sync-summary.json
          cat docs/audits/catalog-r2-diagram-sync-summary.json
          test "$listed" -gt 100000
          test "$matched" -gt 100000

      - name: Verify catalog hard-gate state
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"action":"final-status"}' \
            "$BROKER_URL" > docs/audits/catalog-r2-hard-gate-final-status.json
          cat docs/audits/catalog-r2-hard-gate-final-status.json

      - name: Persist diagram mapping evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nissan-gtr-catalog-gate"
          git config user.email "catalog-gate@users.noreply.github.com"
          git add docs/audits/catalog-r2-diagram-sync-pages.ndjson docs/audits/catalog-r2-diagram-sync-summary.json docs/audits/catalog-r2-hard-gate-final-status.json
          if git diff --cached --quiet; then
            echo "Evidence unchanged"
          else
            git commit -m "audit: persist R2 diagram mapping evidence [skip ci]"
            git push origin HEAD:chatgpt/customer-ui-catalog-hardening-20260902
          fi
