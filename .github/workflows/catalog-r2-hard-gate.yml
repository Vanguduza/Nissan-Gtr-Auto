name: Catalog R2 hard gate

on:
  push:
    branches:
      - chatgpt/customer-ui-catalog-hardening-20260902
    paths:
      - .github/workflows/catalog-r2-hard-gate.yml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  BROKER_URL: https://gylrgwqyuiwkyykardwc.supabase.co/functions/v1/catalog-r2-publish-broker
  OIDC_AUDIENCE: nissan-gtr-catalog-publisher

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/customer-ui-catalog-hardening-20260902

      - name: Mint GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")
          token=$(printf '%s' "$response" | jq -r '.value')
          test -n "$token" && test "$token" != "null"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Inventory live R2 release
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p docs/audits
          curl -fsS \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"action":"inventory"}' \
            "$BROKER_URL" > docs/audits/catalog-r2-hard-gate-inventory.json
          jq -e '.ok == true' docs/audits/catalog-r2-hard-gate-inventory.json >/dev/null
          jq '{release:.release,r2_bucket:.r2_bucket,bundle_reachable:.bundle_reachable,bundle_bytes:.bundle_bytes,serving_sample_count:.serving_sample_count,diagram_prefix_reachable:.diagram_prefix_reachable,candidate_count:(.candidates|length),candidates:.candidates}' docs/audits/catalog-r2-hard-gate-inventory.json

      - name: Persist inventory evidence on hardening branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nissan-gtr-catalog-gate"
          git config user.email "catalog-gate@users.noreply.github.com"
          git add docs/audits/catalog-r2-hard-gate-inventory.json
          if git diff --cached --quiet; then
            echo "Inventory unchanged"
          else
            git commit -m "audit: persist live R2 hard-gate inventory [skip ci]"
            git push origin HEAD:chatgpt/customer-ui-catalog-hardening-20260902
          fi
