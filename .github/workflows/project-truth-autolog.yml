name: Project Truth Autolog

on:
  push:
  pull_request:
  workflow_dispatch:

# Hooks generate source ledgers. CI observes the tested SHA and retains its
# receipt without pushing a competing ledger format or changing the PR head.
permissions:
  contents: read

jobs:
  project-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify canonical source and ledger
        run: |
          python3 scripts/project_truth_guard.py status
          python3 scripts/project_truth_guard.py verify-head
          python3 scripts/test_project_truth_guard.py
      - name: Capture source observation
        run: |
          python3 - <<'OBSERVATION'
          import datetime, hashlib, json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          state = pathlib.Path('PROJECT_CANONICAL_STATE.json')
          manifest = json.loads(state.read_text())
          if manifest['repository'] != os.environ['GITHUB_REPOSITORY']:
              raise SystemExit('BLOCKED: canonical repository identity mismatch')
          if not manifest.get('policy', {}).get('default_branch_is_not_authority'):
              raise SystemExit('BLOCKED: authority policy missing')
          receipt = {
              'schema_version': 1,
              'repository': manifest['repository'],
              'source_commit': git('rev-parse', 'HEAD'),
              'source_tree': git('rev-parse', 'HEAD^{tree}'),
              'canonical_state_sha256': hashlib.sha256(state.read_bytes()).hexdigest(),
              'observed_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'event': os.environ['GITHUB_EVENT_NAME'],
              'ledger_verified': True,
          }
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'project-truth-observation.json').write_text(json.dumps(receipt, indent=2) + chr(10))
          OBSERVATION
      - uses: actions/upload-artifact@v4
        with:
          name: project-truth-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/project-truth-observation.json
      - name: Verify registered release lineages
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'LINEAGES'
          import json, subprocess
          state = json.load(open('PROJECT_CANONICAL_STATE.json'))
          for app in state['applications']:
              subprocess.run(['python3', 'scripts/project_truth_guard.py', 'release-check', '--app', app, '--require-clean'], check=True)
          LINEAGES
