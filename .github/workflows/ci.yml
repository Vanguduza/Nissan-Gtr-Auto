# Phase 14 CI — lint/typecheck, exclusion grep, migrate + SQL smoke (when Docker available)
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Package tests
        run: pnpm test

  exclusions:
    name: Hard exclusions grep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: Scan code paths for excluded integrations
        shell: bash
        run: |
          set -euo pipefail
          # Align with .cursor/BUGBOT.md.
          # Client / bridge / pipeline: implementation-shaped ZIMRA / payroll-tax /
          # HTML5-QR hits fail. Denial comments ("no ZIMRA", "Forbidden: html5-qrcode")
          # are standing exclusions, not integrations.
          # Edge functions: fail on integration-shaped hits (URLs, SDKs, HTML5 QR libs).
          FAIL=0
          scan() {
            local label="$1"
            local pattern="$2"
            shift 2
            local hits
            # Implementation-shaped hits only. Denial comments / copy
            # ("no ZIMRA", "Forbidden: HTML5/browser QR", gross-only payroll)
            # are standing exclusions, not integrations.
            hits=$(rg -n -i --glob '!**/*.md' --glob '!**/.venv/**' --glob '!**/node_modules/**' \
              "$pattern" "$@" 2>/dev/null \
              | rg -vi \
                -e 'no[[:space:]/._-]*zimra' \
                -e 'no[[:space:]/._-]*fdms' \
                -e 'no[[:space:]/._-]*fiscal' \
                -e 'never[[:space:]].*zimra' \
                -e 'forbidden:' \
                -e 'no[[:space:]/._-]*paye' \
                -e 'no[[:space:]/._-]*nssa' \
                -e 'no[[:space:]/._-]*pobs' \
                -e 'no[[:space:]/._-]*apwcs' \
                -e 'no[[:space:]/._-]*zimdef' \
                -e 'tax-agnostic' \
                -e 'zimra\.example' \
                -e 'standing exclusion' \
                -e 'html5/browser qr' \
                -e 'gross only' \
                -e 'gross payroll' \
                -e 'gross[[:space:]−-]+manual' \
              || true)
            if [[ -n "$hits" ]]; then
              echo "::error::Exclusion hit ($label):"
              echo "$hits"
              FAIL=1
            else
              echo "OK: no matches for $label"
            fi
          }
          # Omit data-pipeline/.venv; scan package source + tests + schemas only.
          CLIENT_ROOTS=(apps packages bridges data-pipeline/data_pipeline data-pipeline/tests data-pipeline/schemas)
          # Skip missing roots (apps may be partial early on).
          EXISTING=()
          for r in "${CLIENT_ROOTS[@]}"; do
            [[ -e "$r" ]] && EXISTING+=("$r")
          done
          scan "ZIMRA/FDMS/fiscal (client)" 'zimra|fdms|fiscali[sz]' "${EXISTING[@]}"
          scan "payroll tax (client)" 'paye\b|nssa|pobs|apwcs|zimdef|\bp4a?\b' "${EXISTING[@]}"
          scan "HTML5 / browser QR (client)" 'html5-qrcode|Html5Qrcode|barcode-detector|jsqr\b|@zxing/browser' "${EXISTING[@]}"
          if [[ -d supabase/functions ]]; then
            scan "ZIMRA/FDMS SDK/URL (edge)" 'zimra\.(gov|com)|fdms\.|/fiscali[sz]|@zimra/' supabase/functions
            scan "HTML5 / browser QR (edge)" 'html5-qrcode|Html5Qrcode|@zxing/browser' supabase/functions
          fi
          if [[ -d supabase/migrations ]]; then
            scan "HTML5 / browser QR (migrations)" 'html5-qrcode|Html5Qrcode|@zxing/browser' supabase/migrations
          fi
          if [[ "$FAIL" -ne 0 ]]; then
            exit 1
          fi

  vehicle-artwork:
    name: Vehicle artwork set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify 94 WebPs cover the Android resolver
        run: python3 scripts/test_vehicle_artwork_set.py

  db-smoke:
    name: Migrate + SQL smoke
    runs-on: ubuntu-latest
    # Docker is available on GitHub-hosted Linux runners. Windows/local without
    # Docker: use the documented docker-exec path in docs/HARDENING.md.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install deps (supabase CLI via npx)
        run: pnpm install --frozen-lockfile
      - name: Start Supabase (Docker)
        run: npx supabase start
      - name: Apply migrations + seed
        run: npx supabase db reset --yes
      - name: Resolve DB container
        id: db
        shell: bash
        run: |
          set -euo pipefail
          NAME=$(docker ps --format '{{.Names}}' | grep -E 'supabase_db_' | head -n1)
          if [[ -z "$NAME" ]]; then
            echo "::error::No supabase_db_* container found"
            exit 1
          fi
          echo "container=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using DB container: $NAME"
      - name: Run phase2 RLS smoke
        run: |
          docker exec -i "${{ steps.db.outputs.container }}" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/phase2_rls_smoke.sql
      - name: Run phase14 CI RLS gate
        run: |
          docker exec -i "${{ steps.db.outputs.container }}" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/phase14_ci_smoke.sql
      - name: Run vehicle-artwork storage smoke
        run: |
          docker exec -i "${{ steps.db.outputs.container }}" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/vehicle_artwork_storage_smoke.sql
      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup || true
