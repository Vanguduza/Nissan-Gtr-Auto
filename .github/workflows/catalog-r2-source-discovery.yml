name: Catalog R2 source discovery

on:
  push:
    branches:
      - chatgpt/customer-ui-catalog-hardening-20260902
    paths:
      - .github/workflows/catalog-r2-source-discovery.yml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  BROKER_URL: https://gylrgwqyuiwkyykardwc.supabase.co/functions/v1/catalog-r2-publish-broker
  OIDC_AUDIENCE: nissan-gtr-catalog-publisher

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/customer-ui-catalog-hardening-20260902

      - name: Mint GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")
          token=$(printf '%s' "$response" | jq -r '.value')
          test -n "$token" && test "$token" != "null"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Inspect migration archive central directories with R2 range reads
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p docs/audits
          cat > /tmp/remote_zip_index.py <<'PY'
          import json, os, re, struct, sys, urllib.request

          url, key, out_path = sys.argv[1:4]

          def fetch_range(spec):
              req = urllib.request.Request(url, headers={"Range": spec, "User-Agent": "nissan-gtr-catalog-gate/1"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  data = r.read()
                  return data, dict(r.headers)

          tail, headers = fetch_range("bytes=-131072")
          content_range = headers.get("Content-Range", "")
          m = re.search(r"/(\d+)$", content_range)
          if not m:
              raise RuntimeError(f"R2 did not return total size in Content-Range: {content_range!r}")
          total_size = int(m.group(1))
          sig = b"PK\x05\x06"
          eocd = tail.rfind(sig)
          if eocd < 0:
              raise RuntimeError("ZIP EOCD not found in ranged tail")
          if eocd + 22 > len(tail):
              raise RuntimeError("truncated EOCD")
          _, disk, cd_disk, disk_entries, total_entries, cd_size, cd_offset, comment_len = struct.unpack_from("<IHHHHIIH", tail, eocd)
          if total_entries == 0xFFFF or cd_size == 0xFFFFFFFF or cd_offset == 0xFFFFFFFF:
              raise RuntimeError("ZIP64 archive detected; extended parser required")
          if cd_size > 64 * 1024 * 1024:
              raise RuntimeError(f"central directory unexpectedly large: {cd_size}")
          cd, cd_headers = fetch_range(f"bytes={cd_offset}-{cd_offset + cd_size - 1}")
          if len(cd) != cd_size:
              raise RuntimeError(f"central directory range mismatch: expected {cd_size}, got {len(cd)}")

          p = 0
          entries = []
          pattern = re.compile(r"catalog|sqlite|\.db$|\.sqlite$|ndjson|jsonl|parquet|csv|manifest|index|mapping|part|fitment|hotspot|placement|applicability|normalized|release|source", re.I)
          matches = []
          while p + 46 <= len(cd):
              if cd[p:p+4] != b"PK\x01\x02":
                  break
              fields = struct.unpack_from("<IHHHHHHIIIHHHHHII", cd, p)
              _, made_by, needed, flags, method, mtime, mdate, crc32, comp_size, uncomp_size, name_len, extra_len, comment_len, disk_start, int_attr, ext_attr, local_offset = fields
              name_bytes = cd[p+46:p+46+name_len]
              encoding = "utf-8" if flags & 0x800 else "cp437"
              name = name_bytes.decode(encoding, errors="replace")
              row = {
                  "name": name,
                  "method": method,
                  "compressed_size": comp_size,
                  "uncompressed_size": uncomp_size,
                  "local_header_offset": local_offset,
                  "crc32": f"{crc32:08x}",
              }
              entries.append(row)
              if pattern.search(name):
                  matches.append(row)
              p += 46 + name_len + extra_len + comment_len

          result = {
              "ok": True,
              "key": key,
              "size": total_size,
              "entry_count_declared": total_entries,
              "entry_count_parsed": len(entries),
              "central_directory": {"offset": cd_offset, "size": cd_size},
              "sample": entries[:40],
              "match_count": len(matches),
              "matches": matches[:10000],
          }
          with open(out_path, "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          PY

          for item in post-migration pre-migration pre2; do
            key="migration-audit/${item}.zip"
            payload=$(jq -nc --arg key "$key" '{action:"presign-get",key:$key}')
            curl -fsS \
              -H "Authorization: Bearer ${OIDC_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "$BROKER_URL" > "/tmp/${item}-presign.json"
            signed_url=$(jq -r '.signed_url' "/tmp/${item}-presign.json")
            test -n "$signed_url" && test "$signed_url" != "null"
            python3 /tmp/remote_zip_index.py \
              "$signed_url" \
              "$key" \
              "docs/audits/catalog-r2-${item}-zip-index.json"
            jq -e '.ok == true' "docs/audits/catalog-r2-${item}-zip-index.json" >/dev/null
            jq '{key,size,entry_count_parsed,match_count,matches}' "docs/audits/catalog-r2-${item}-zip-index.json"
          done

      - name: Persist source-discovery evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nissan-gtr-catalog-gate"
          git config user.email "catalog-gate@users.noreply.github.com"
          git add docs/audits/catalog-r2-*-zip-index.json
          if git diff --cached --quiet; then
            echo "Evidence unchanged"
          else
            git commit -m "audit: persist R2 migration archive indexes [skip ci]"
            git push origin HEAD:chatgpt/customer-ui-catalog-hardening-20260902
          fi
