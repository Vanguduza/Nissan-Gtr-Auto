name: Customer Android Canonical

on:
  push:
    branches:
      - work/customer-illustrated-canonical-20260909
  pull_request:
    paths:
      - 'apps/android-customer/**'
      - 'bridges/android/**'
      - 'packages/android-ui/**'
      - 'supabase/migrations/**'
      - 'PROJECT_CANONICAL_STATE.json'
      - 'scripts/project_truth_guard.py'
      - '.github/workflows/customer-android-canonical.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  customer-android-canonical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify locked customer lineage
        run: python3 scripts/project_truth_guard.py release-check --app customer-android
      - name: Reject legacy/fake production paths
        shell: bash
        run: |
          ! grep -R -n -E 'FakeRpcClient|RPC_FORCE_FAKE|Fake mode|Demo account|gylrgwqyuiwkyykardwc' \
            apps/android-customer/app/src/main \
            apps/android-customer/feature \
            apps/android-customer/core/rpc/src/main
      - name: Test customer modules
        working-directory: apps/android-customer
        run: ./gradlew test --stacktrace
      - name: Assemble illustrated customer APK
        working-directory: apps/android-customer
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload illustrated customer APK
        uses: actions/upload-artifact@v4
        with:
          name: nissan-gtr-customer-illustrated-${{ github.sha }}
          path: apps/android-customer/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
