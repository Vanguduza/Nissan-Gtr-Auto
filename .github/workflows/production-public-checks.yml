name: Production public checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    environment: Production
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://bicyjghgdnzlnjqxzoud.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Observe approved public deployment without business mutations
        run: node scripts/check-public-production.mjs --output "${{ runner.temp }}/public-runtime.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: public-runtime-observation
          path: ${{ runner.temp }}/public-runtime.json
