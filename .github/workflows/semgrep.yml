# Semgrep CE (D-48)
# - semgrep-dial: in-repo custom rules — HARD FAIL on findings/errors
# - semgrep-community: p/* packs — advisory (continue-on-error); tune → hard-fail later
# No Semgrep App token required for Community Edition.

name: semgrep

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep-dial:
    name: Semgrep DIAL rules (hard-fail)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Scan with DIAL custom rules
        run: |
          semgrep scan \
            --config semgrep/rules \
            --error \
            --metrics=off \
            --exclude=ThreatDragonModels \
            --exclude=docs \
            --exclude=node_modules \
            .
        # Root semgrep.yml mirrors these rules for local `semgrep scan --config semgrep.yml`.
        # Use only one --config here to avoid duplicate findings.

  semgrep-community:
    name: Semgrep community packs (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Scan with community configs
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/javascript \
            --config p/react \
            --config p/nextjs \
            --config p/owasp-top-ten \
            --error \
            --metrics=off \
            --exclude=ThreatDragonModels \
            --exclude=docs \
            --exclude=node_modules \
            --exclude=semgrep \
            .
        # Advisory until monorepo baseline exists; does not soft-fail semgrep-dial.
        # Flip continue-on-error: false after first clean baseline on main.
