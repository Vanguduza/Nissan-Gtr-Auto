# Semgrep CE — Nissan GTR AppSec baseline (DIAL D-48 habits)
# - semgrep-gtr: in-repo custom rules — HARD FAIL on findings/errors
# - semgrep-community: p/* packs — advisory (continue-on-error); tune → hard-fail later
# No Semgrep App token required for Community Edition.

name: semgrep

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep-gtr:
    name: Semgrep GTR rules (hard-fail)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Scan with GTR custom rules
        run: |
          semgrep scan \
            --config semgrep/rules \
            --error \
            --metrics=off \
            --exclude=docs \
            --exclude=node_modules \
            --exclude=reference \
            --exclude=data-pipeline \
            .
        # Root semgrep.yml mirrors these rules for local `semgrep scan --config semgrep.yml`.

  semgrep-community:
    name: Semgrep community packs (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Scan with community configs
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/javascript \
            --config p/react \
            --config p/nextjs \
            --config p/owasp-top-ten \
            --error \
            --metrics=off \
            --exclude=docs \
            --exclude=node_modules \
            --exclude=semgrep \
            --exclude=reference \
            --exclude=data-pipeline \
            .
