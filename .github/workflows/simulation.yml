# Business simulation: a throwaway local Supabase stack using the complete active migration
# chain, simulated staff/customers/stock, then every end-to-end scenario (till, cash on
# delivery, driver cash, cards, back-orders, exceptions, restocking) and the single-role SQL tests.
# Never touches the hosted project.
name: Simulation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/simulation.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"

concurrency:
  group: simulation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scenarios:
    name: Trading-day scenarios + role rules
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install psql + Python deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          pip install psycopg2-binary cryptography
      - name: Run scenarios and role rules
        run: supabase/sim/ci/run.sh
      - name: Stop stack
        if: always()
        working-directory: supabase/sim/ci
        run: npx -y supabase@2.120.0 stop --no-backup || true
