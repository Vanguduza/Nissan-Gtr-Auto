# Business simulation: a throwaway local Supabase stack loaded from supabase/sim/snapshot (+ newer
# migrations), simulated staff/customers/stock, then every end-to-end scenario (till, cash on
# delivery, driver cash, cards, back-orders, exceptions, restocking) and the single-role SQL tests.
# Never touches the hosted project.
name: Simulation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/simulation.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"

concurrency:
  group: simulation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scenarios:
    name: Trading-day scenarios + role rules
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install psql + Python deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          pip install psycopg2-binary cryptography
      - name: Run scenarios and role rules
        run: supabase/sim/ci/run.sh
      - name: Stop stack
        if: always()
        working-directory: supabase/sim/ci
        run: npx -y supabase@latest stop --no-backup || true
