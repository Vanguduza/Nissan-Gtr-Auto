<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ID card · GTRD1001</title>
<style>
  :root {
    --primary: #C8102E;
    --steel: #12151C;
    --steel-lift: #1E2430;
    --chalk: #F4F5F7;
    --mist: #E8ECF1;
    --silver: #C0C5CE;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: linear-gradient(160deg, #1a1f2a 0%, #0d1016 100%);
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--steel);
  }
  .frame {
    padding: 2rem;
    text-align: center;
  }
  .meta {
    color: var(--silver);
    font-size: 0.75rem;
    margin-bottom: 1rem;
    letter-spacing: 0.04em;
  }
  .card {
    width: 85.6mm;
    height: 54mm;
    margin: 0 auto;
    background: var(--chalk);
    border-radius: 2mm;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    display: grid;
    grid-template-rows: 22px 1fr 22px;
    text-align: left;
  }
  .header {
    background: var(--steel);
    color: #fff;
    font-size: 8pt;
    font-weight: 700;
    padding: 5px 8px 0;
    border-top: 3px solid var(--primary);
  }
  .body {
    display: grid;
    grid-template-columns: 48px 1fr auto;
    gap: 8px;
    padding: 8px;
    align-items: start;
  }
  .photo {
    width: 48px;
    height: 58px;
    background: var(--mist);
    border: 0.75px solid var(--silver);
    display: grid;
    place-items: center;
    font-size: 6pt;
    color: #595e66;
  }
  .name {
    font-size: 11pt;
    font-weight: 700;
    color: var(--steel);
    line-height: 1.2;
  }
  .role {
    margin-top: 4px;
    font-size: 8pt;
    color: #595e66;
  }
  .staff-badge {
    display: inline-block;
    margin-top: 6px;
    padding: 2px 6px;
    font-size: 7pt;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #fff;
    background: var(--primary);
  }
  .verify {
    width: 36px;
    height: 36px;
    border: 1px solid var(--steel);
    background: #fff;
    display: grid;
    place-content: center;
    text-align: center;
    font-size: 5pt;
    font-weight: 700;
    color: var(--steel);
  }
  .verify small {
    display: block;
    font-weight: 400;
    color: #595e66;
    font-size: 4pt;
  }
  .footer {
    background: var(--steel-lift);
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 8px;
    font-size: 9pt;
    font-weight: 700;
  }
  .footer span:last-child {
    font-size: 5pt;
    font-weight: 400;
    color: var(--silver);
  }
</style>
</head>
<body>
  <div class="frame">
    <p class="meta">Simulated HR onboarding · CR80 ID card (no fiscal QR)</p>
    <article class="card" aria-label="Staff ID card">
      <div class="header">Nissan GTR Auto</div>
      <div class="body">
        <div class="photo">PHOTO</div>
        <div>
          <div class="name">Tariro Moyo</div>
          <div class="role">Delivery Driver</div>
          <div class="staff-badge">Driver</div>
        </div>
        <div class="verify"><span>VERIFY</span><small>staff token</small></div>
      </div>
      <div class="footer">
        <span>GTRD1001</span>
        <span>85.6×54 mm · no fiscal QR</span>
      </div>
    </article>
    <p class="meta" style="margin-top:1rem">Delivery Driver · Staff: Driver</p>
  </div>
</body>
</html>
