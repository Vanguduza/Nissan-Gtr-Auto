<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ID card · GTRD1001</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Titillium+Web:wght@600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --primary: #C8102E;
    --steel: #12151C;
    --steel-lift: #1E2430;
    --chalk: #F4F5F7;
    --mist: #E8ECF1;
    --silver: #C0C5CE;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(200,16,46,0.18), transparent 45%),
      linear-gradient(165deg, #1a1f2a 0%, #0d1016 55%, #12151C 100%);
    font-family: "Source Sans 3", "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--steel);
  }
  .frame {
    padding: 2rem 1.25rem 2.5rem;
    text-align: center;
    max-width: 42rem;
  }
  .meta {
    color: var(--silver);
    font-size: 0.75rem;
    margin: 0 0 1rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .faces {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    justify-content: center;
    align-items: flex-start;
  }
  .face-wrap {
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
  }
  .face-label {
    color: var(--silver);
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .card {
    width: 85.6mm;
    height: 54mm;
    margin: 0 auto;
    border-radius: 2.2mm;
    overflow: hidden;
    box-shadow: 0 14px 42px rgba(0,0,0,0.5);
    position: relative;
  }
  /* —— Front —— */
  .card-front {
    background:
      linear-gradient(135deg, var(--chalk) 0%, var(--mist) 55%, #e2e6ed 100%);
    display: grid;
    grid-template-rows: 7mm 1fr 6.5mm;
  }
  .card-front::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 2.2mm;
    background: var(--primary);
    z-index: 2;
  }
  .front-top {
    background: linear-gradient(90deg, var(--steel) 0%, var(--steel-lift) 100%);
    border-bottom: 1.6px solid var(--primary);
    display: flex;
    align-items: center;
    padding: 0 3.5mm 0 4.5mm;
    color: #fff;
    font-family: "Titillium Web", "Source Sans 3", sans-serif;
    font-size: 7.5pt;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .front-body {
    display: grid;
    grid-template-columns: 16mm 1fr 16mm;
    align-items: center;
    gap: 2mm;
    padding: 2.5mm 3.5mm 2mm 5mm;
    position: relative;
    z-index: 1;
  }
  .photo {
    width: 14.5mm;
    height: 18mm;
    background: #fff;
    border: 0.7px solid var(--silver);
    box-shadow: 0 1px 0 rgba(18,21,28,0.08);
    display: grid;
    place-items: center;
    font-size: 5.5pt;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: #6b7280;
    justify-self: start;
  }
  .identity {
    text-align: center;
    padding: 0 1mm;
    min-width: 0;
  }
  .name {
    font-family: "Titillium Web", "Source Sans 3", sans-serif;
    font-size: 11pt;
    font-weight: 700;
    color: var(--steel);
    line-height: 1.15;
    letter-spacing: 0.01em;
  }
  .position {
    margin-top: 1.8mm;
    font-size: 7.5pt;
    font-weight: 600;
    color: #3d4450;
    line-height: 1.25;
  }
  .emp-no {
    margin-top: 2.2mm;
    font-family: "Titillium Web", "Source Sans 3", sans-serif;
    font-size: 9pt;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: 0.08em;
  }
  .logo, .logo-mark {
    width: 14mm;
    height: 14mm;
    justify-self: end;
    object-fit: contain;
  }
  .logo-mark {
    display: grid;
    place-items: center;
    background: var(--steel);
    border: 1px solid var(--primary);
    color: #fff;
    font-family: "Titillium Web", sans-serif;
    font-weight: 700;
    font-size: 8pt;
    letter-spacing: 0.06em;
  }
  .front-foot {
    background: var(--steel);
    color: var(--silver);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 3.5mm 0 5mm;
    font-size: 5.5pt;
    letter-spacing: 0.04em;
  }
  .front-foot strong {
    color: #fff;
    font-weight: 700;
  }
  /* —— Back —— */
  .card-back {
    background: linear-gradient(160deg, var(--steel) 0%, var(--steel-lift) 70%, #161a22 100%);
    display: grid;
    grid-template-rows: 7mm 1fr 6.5mm;
    color: #fff;
  }
  .card-back::after {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 1.6px;
    background: var(--primary);
  }
  .back-top {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Titillium Web", sans-serif;
    font-size: 7pt;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--silver);
  }
  .back-body {
    display: grid;
    place-items: center;
    padding: 1mm 3mm;
  }
  .qr-frame {
    background: var(--chalk);
    padding: 1.6mm;
    border-radius: 1mm;
    box-shadow: 0 0 0 1px rgba(192,197,206,0.25);
  }
  .qr-frame img {
    display: block;
    width: 26mm;
    height: 26mm;
  }
  .qr-missing {
    width: 26mm;
    height: 26mm;
    display: grid;
    place-items: center;
    font-size: 6pt;
    color: var(--steel);
  }
  .back-foot {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2mm;
    font-size: 5.5pt;
    color: var(--silver);
    letter-spacing: 0.05em;
  }
  .back-foot code {
    color: #fff;
    font-family: "Source Sans 3", monospace;
    font-weight: 700;
    letter-spacing: 0.06em;
  }
</style>
</head>
