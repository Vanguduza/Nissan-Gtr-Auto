# Optional OSS satellites for Nissan GTR Auto ERP
# Docs: infra/satellites/README.md
# Usage:
#   docker compose -f docker-compose.satellites.yml --profile search up -d
#   docker compose -f docker-compose.satellites.yml --profile search --profile gps up -d
#   bash infra/satellites/osrm/prepare.sh && docker compose -f docker-compose.satellites.yml --profile routing up -d
#   bash infra/satellites/maptiles/prepare.sh && docker compose -f docker-compose.satellites.yml --profile maptiles up -d

services:
  meilisearch:
    profiles: ["search"]
    image: getmeili/meilisearch:v1.11
    container_name: gtr-meilisearch
    ports:
      - "7700:7700"
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-gtr_dev_meili_master_change_me}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    # Official image is minimal (no curl/wget) — check http://127.0.0.1:7700/health from the host

  # Optional — fleet GPS server. Local smoke only (embedded DB).
  traccar:
    profiles: ["gps"]
    image: traccar/traccar:latest
    container_name: gtr-traccar
    ports:
      - "8082:8082"
      - "5000-5150:5000-5150"
      - "5000-5150:5000-5150/udp"
    volumes:
      - traccar_data:/opt/traccar/data
    # Prefer mapping devices into GTR fleet entities; do not replace Bridge-First GPS on device.

  # OSRM — distance/route SoR (H6 / B-OSRM-1). Prepare graph first:
  #   bash infra/satellites/osrm/prepare.sh
  # Docs: infra/satellites/osrm/README.md
  # Port clash: do not combine --profile routing with --profile gps unless
  # OSRM_HOST_PORT is remapped (Traccar publishes host 5000–5150).
  osrm:
    profiles: ["routing"]
    image: ${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend:v5.27.1}
    container_name: gtr-osrm
    ports:
      - "${OSRM_HOST_PORT:-5000}:5000"
    volumes:
      - ./infra/satellites/osrm/data:/data
    environment:
      OSRM_REGION: ${OSRM_REGION:-zimbabwe}
    command:
      - osrm-routed
      - --algorithm
      - mld
      - /data/${OSRM_REGION:-zimbabwe}-latest.osrm
    # Fails fast if prepare.sh has not produced the .osrm graph yet.

  # MapLibre basemap tiles (Planetiler MBTiles → tileserver-gl). Prepare first:
  #   bash infra/satellites/maptiles/prepare.sh
  #   # or smoke: MAPTILES_SMOKE=1 bash infra/satellites/maptiles/prepare.sh
  # Docs: infra/satellites/maptiles/README.md
  # Style: http://127.0.0.1:${MAPTILES_HOST_PORT:-8081}/styles/basic-preview/style.json
  maptiles:
    profiles: ["maptiles"]
    image: ${TILESERVER_GL_IMAGE:-maptiler/tileserver-gl:v5.3.0}
    container_name: gtr-maptiles
    ports:
      - "${MAPTILES_HOST_PORT:-8081}:8080"
    volumes:
      - ./infra/satellites/maptiles/data:/data
    command:
      - --file
      - /data/${MAPTILES_MBTILES:-basemap.mbtiles}
    # Fails if prepare.sh has not produced basemap.mbtiles yet.

  # FlareSolverr — Cloudflare challenge solver for catalog scrape (Amayama).
  # Usage: docker compose -f docker-compose.satellites.yml --profile scrape up -d
  flaresolverr:
    profiles: ["scrape"]
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: gtr-flaresolverr
    ports:
      - "8191:8191"
    environment:
      LOG_LEVEL: info
      TZ: Africa/Harare
    restart: unless-stopped

  # Gorse — Phase C collaborative filtering (Apache-2.0). Scaffold only.
  # Do not enable until sales event feed + staff UI are ready.
  # Docs: infra/satellites/PHASE2_PROPHET_GORSE.md
  # gorse:
  #   profiles: ["recommend"]
  #   image: zhenghaoz/gorse-in-one:latest
  #   container_name: gtr-gorse
  #   ports:
  #     - "8086:8086"
  #     - "8087:8087"
  #     - "8088:8088"
  #   environment:
  #     GORSE_CACHE_STORE: redis://redis:6379
  #     GORSE_DATA_STORE: mysql://gorse:gorse@tcp(mysql:3306)/gorse
  #   # Prefer Postgres event export from completed sales — never cart speculation alone.

volumes:
  meili_data:
  traccar_data:
