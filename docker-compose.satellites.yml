# Optional OSS satellites for Nissan GTR Auto ERP
# Docs: infra/satellites/README.md
# Usage:
#   docker compose -f docker-compose.satellites.yml --profile search up -d
#   docker compose -f docker-compose.satellites.yml --profile search --profile gps up -d

services:
  meilisearch:
    profiles: ["search"]
    image: getmeili/meilisearch:v1.11
    container_name: gtr-meilisearch
    ports:
      - "7700:7700"
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-gtr_dev_meili_master_change_me}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    # Official image is minimal (no curl/wget) — check http://127.0.0.1:7700/health from the host

  # Optional — fleet GPS server. Local smoke only (embedded DB).
  traccar:
    profiles: ["gps"]
    image: traccar/traccar:latest
    container_name: gtr-traccar
    ports:
      - "8082:8082"
      - "5000-5150:5000-5150"
      - "5000-5150:5000-5150/udp"
    volumes:
      - traccar_data:/opt/traccar/data
    # Prefer mapping devices into GTR fleet entities; do not replace Bridge-First GPS on device.

  # OSRM — stub only. Uncomment after placing preprocessed map data under
  # infra/satellites/osrm/data/ (see infra/satellites/README.md).
  # osrm:
  #   profiles: ["routing"]
  #   image: ghcr.io/project-osrm/osrm-backend:latest
  #   container_name: gtr-osrm
  #   ports:
  #     - "5000:5000"
  #   volumes:
  #     - ./infra/satellites/osrm/data:/data
  #   command: osrm-routed --algorithm mld /data/region.osrm

  # FlareSolverr — Cloudflare challenge solver for catalog scrape (Amayama).
  # Usage: docker compose -f docker-compose.satellites.yml --profile scrape up -d
  flaresolverr:
    profiles: ["scrape"]
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: gtr-flaresolverr
    ports:
      - "8191:8191"
    environment:
      LOG_LEVEL: info
      TZ: Africa/Harare
    restart: unless-stopped

  # Gorse — Phase C collaborative filtering (Apache-2.0). Scaffold only.
  # Do not enable until sales event feed + staff UI are ready.
  # Docs: infra/satellites/PHASE2_PROPHET_GORSE.md
  # gorse:
  #   profiles: ["recommend"]
  #   image: zhenghaoz/gorse-in-one:latest
  #   container_name: gtr-gorse
  #   ports:
  #     - "8086:8086"
  #     - "8087:8087"
  #     - "8088:8088"
  #   environment:
  #     GORSE_CACHE_STORE: redis://redis:6379
  #     GORSE_DATA_STORE: mysql://gorse:gorse@tcp(mysql:3306)/gorse
  #   # Prefer Postgres event export from completed sales — never cart speculation alone.

volumes:
  meili_data:
  traccar_data:
