# Nissan GTR Auto ERP — local Supabase
project_id = "gylrgwqyuiwkyykardwc"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Local only. Production Auth site URL: https://nissangtrauto.co.zw
site_url = "http://127.0.0.1:3000"
# Web + mobile OAuth / deep-link return paths (mirror on hosted Auth → URL config).
additional_redirect_urls = [
  "http://127.0.0.1:3000",
  "http://127.0.0.1:3000/auth/callback",
  "https://nissangtrauto.co.zw",
  "https://nissangtrauto.co.zw/auth/callback",
  "https://www.nissangtrauto.co.zw",
  "https://www.nissangtrauto.co.zw/auth/callback",
  "gtrcustomer://auth/callback",
  "gtr-customer://auth/callback",
]
# Must be true so first-time Google/Apple can create Auth users.
# Public email/password GoTrue signup is blocked by hook_before_user_created
# (OTP complete_signup + HR onboarding set app_metadata.gtr_provisioned_via).
enable_signup = true

[auth.email]
# GoTrue maps this to EXTERNAL_EMAIL_ENABLED — false disables ALL email auth
# (including password login). Keep true so seeded/staff users can sign in;
# public email signup is blocked by [auth.hook.before_user_created], not this flag.
enable_signup = true
enable_confirmations = false

# Reject public /signup while allowing Google/Apple + Edge Admin provisioning.
# Hosted: Dashboard → Authentication → Hooks → Before user created → same pg function.
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_before_user_created"

# OAuth — secrets via env() only; never commit values.
# Local: keep enabled=false until Client ID + Secret exist in supabase/.env
#   (or shell). Then set enabled=true and restart (`supabase stop` / `start`).
#   Env names: SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID / _SECRET
#              SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID / _SECRET
# Hosted: Dashboard → Authentication → Providers (enable + paste credentials).
# config.toml does not control hosted. See docs/CUSTOMER_OAUTH_SETUP.md
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false

[auth.external.apple]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false

[analytics]
enabled = false

# Edge Functions — per-function JWT gate at the gateway.
# Webhooks: verify_jwt = false (HMAC / provider signature in handler).
# Workers: JWT may be on; handlers still require x-worker-secret (WORKER_SHARED_SECRET).
# Initiate: verify_jwt = true (caller Bearer JWT).

[functions.contipay-webhook]
verify_jwt = false

[functions.paynow-webhook]
verify_jwt = false

# Meta cannot send a Supabase JWT — AuthZ is X-Hub-Signature-256 in handler.
[functions.whatsapp-webhook]
verify_jwt = false

[functions.contipay-initiate]
verify_jwt = true

[functions.paynow-initiate]
verify_jwt = true

[functions.process-sms-outbox]
verify_jwt = true

[functions.process-customer-receipts]
verify_jwt = true

[functions.demand-forecast]
verify_jwt = true

# Worker: FIFO / Temporal dispatch cycle → assign_delivery_job (x-worker-secret)
[functions.delivery-dispatch-cycle]
verify_jwt = true

# Staff JWT → KPI RPCs + optional Gemini narrative
[functions.analytics-insights]
verify_jwt = true

# Cron worker: still requires x-worker-secret (WORKER_SHARED_SECRET)
[functions.process-ai-reports]
verify_jwt = true

# Cron worker: opt-in CRM promos (x-worker-secret)
[functions.process-crm-promos]
verify_jwt = true

# Staff JWT → ABC + forecast KPIs + optional Gemini directives
[functions.stores-insights]
verify_jwt = true

# Authenticated catalog typeahead — Meili proxy with FTS fallback
[functions.catalog-search-meili]
verify_jwt = true

# Optional chat notify worker (x-worker-secret); stub delivery by default
[functions.chat-notify-on-message]
verify_jwt = true

# Public company-domain receipt links (Next.js proxies with anon JWT).
# AuthZ = download_token lookup; service_role stays inside the function.
[functions.receipt-download]
verify_jwt = true

[functions.render-branded-doc]
verify_jwt = true

# HR/admin: create/link Auth user after complete_hr_onboarding; deliver temp
# credentials via hr_credential_outbox + existing email/SMS/WA gateways.
# AuthZ = staff JWT + has_staff_role(admin|hr); never returns password to client.
[functions.hr-onboarding-create-auth]
verify_jwt = true

# Customer signup/login OTP (email | phone). Fail-closed without gateway secrets;
# AUTH_OTP_ALLOW_UNVERIFIED_LOCAL=1 + keys unset → stub code 000000 only (non-prod).
# verify mints proof_token; complete_signup/login require it.
# Public GoTrue email signup blocked by before_user_created hook (not enable_signup=false).
[functions.auth-otp]
verify_jwt = false
