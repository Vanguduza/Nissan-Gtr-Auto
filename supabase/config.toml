# Nissan GTR Auto ERP — local Supabase
project_id = "bicyjghgdnzlnjqxzoud"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Local only. Production Auth site URL: https://nissangtrauto.co.zw
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "http://127.0.0.1:3000",
  "http://127.0.0.1:3000/auth/callback",
  "https://nissangtrauto.co.zw",
  "https://nissangtrauto.co.zw/auth/callback",
  "https://www.nissangtrauto.co.zw",
  "https://www.nissangtrauto.co.zw/auth/callback",
  "gtrcustomer://auth/callback",
  "gtr-customer://auth/callback",
]
# Keep signup enabled at GoTrue so OAuth and server-side Supabase Auth provisioning work.
# Direct public password signup remains blocked by hook_before_user_created.
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Reject direct public signup while allowing Google/Apple, HR provisioning and the
# canonical Supabase Auth Edge provisioning marker.
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_before_user_created"

# Hosted Send Email / Send SMS hooks are HTTP hooks configured in the Supabase
# Auth Hooks dashboard and point to auth-send-email-hook / auth-send-sms-hook.
# The Edge handlers verify Standard Webhooks signatures and fail closed when
# their generated hook secrets or delivery credentials are absent.

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false

[auth.external.apple]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false

[analytics]
enabled = false

# Edge Functions — per-function JWT gate at the gateway.
# Provider/Auth hooks use verify_jwt=false because their own signed callback
# contract is authoritative. Public auth orchestration endpoints are also false;
# Supabase Auth itself mints/verifies credentials and the handlers apply their
# own validation/rate limits before returning any session.

[functions.contipay-webhook]
verify_jwt = false

[functions.paynow-webhook]
verify_jwt = false

[functions.ecocash-webhook]
verify_jwt = false

[functions.whatsapp-webhook]
verify_jwt = false

[functions.contipay-initiate]
verify_jwt = true

[functions.paynow-initiate]
verify_jwt = true

[functions.ecocash-initiate]
verify_jwt = true

[functions.process-sms-outbox]
verify_jwt = true

[functions.process-customer-receipts]
verify_jwt = true

[functions.demand-forecast]
verify_jwt = true

[functions.analytics-insights]
verify_jwt = true

[functions.process-ai-reports]
verify_jwt = true

[functions.process-crm-promos]
verify_jwt = true

[functions.stores-insights]
verify_jwt = true

[functions.catalog-search-meili]
verify_jwt = true

[functions.chat-notify-on-message]
verify_jwt = true

[functions.receipt-download]
verify_jwt = true

[functions.render-branded-doc]
verify_jwt = true

[functions.hr-onboarding-create-auth]
verify_jwt = true

# Canonical customer Auth Edge. Supabase Auth owns users, passwords, OTPs,
# verification and sessions. This function only orchestrates signup/login UX,
# custom abuse controls and commerce-profile provisioning.
[functions.auth-otp]
verify_jwt = false

# Public recovery endpoints. Request is deliberately non-enumerating; verify
# must present a native Supabase recovery/email OTP or phone OTP.
[functions.request-password-reset]
verify_jwt = false

[functions.verify-password-reset]
verify_jwt = false

# Supabase Auth Send Email / Send SMS hooks authenticate with signed Standard
# Webhooks payloads, not a Supabase user JWT.
[functions.auth-send-email-hook]
verify_jwt = false

[functions.auth-send-sms-hook]
verify_jwt = false
